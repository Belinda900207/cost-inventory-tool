name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check . ../scripts
      - run: python -m ruff format --check . ../scripts
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  mysql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python scripts/init_test_env.py
      - run: docker compose --env-file .env.test -p cost-inventory-test -f compose.test.yaml up -d --wait --wait-timeout 150
      - run: python -m pytest -q -s tests/integration
        working-directory: backend
        env:
          RUN_MYSQL_INTEGRATION: '1'
      - if: always()
        run: docker compose --env-file .env.test -p cost-inventory-test -f compose.test.yaml stop
