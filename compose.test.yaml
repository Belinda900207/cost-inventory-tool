name: cost-inventory-test
services:
  db:
    image: mysql:8.4
    env_file: .env.test
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
      - ./scripts/mysql-healthcheck.sh:/usr/local/bin/app-healthcheck:ro
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/app-healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
volumes:
  mysql_test_data:
